<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFLI 지수 시각화 결과</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .info {
            padding: 10px 15px;
            font: 14px/1.5 "Malgun Gothic", Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            color: #333;
        }
        .info h4 { margin: 0 0 5px; color: #555; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .legend {
            line-height: 22px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #999;
        }
        /* 검색창 스타일 */
        .search-box {
            padding: 10px;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            display: flex;
            gap: 5px;
        }
        .search-box input {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-family: 'Malgun Gothic', sans-serif;
            width: 150px;
        }
        .search-box button {
            padding: 5px 10px;
            border: none;
            background: #444;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Malgun Gothic', sans-serif;
        }
        .search-box button:hover {
            background: #666;
        }
        /* 시군구 라벨 스타일 */
        .gu-label div {
            color: #000;
            font-weight: 900;
            font-size: 14px;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // 1. 지도 초기화 (서울 중심)
    var map = L.map('map').setView([37.5665, 126.9780], 10);

    // 2. 배경 지도 추가 (OpenStreetMap - 기본 한국어 지명 지원)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    // [추가] 검색창 컨트롤
    var searchControl = L.control({position: 'topleft'});
    searchControl.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'search-box');
        div.innerHTML = '<input type="text" id="searchInput" placeholder="행정동 검색 (예: 서교동)" onkeydown="if(event.key===\'Enter\') searchMap()">' +
                        '<button onclick="searchMap()">검색</button>';
        // 지도 드래그 등 이벤트 버블링 방지
        L.DomEvent.disableClickPropagation(div);
        return div;
    };
    searchControl.addTo(map);

    // 검색 실행 함수
    function searchMap() {
        var query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        var foundLayer = null;
        var foundScore = 0;

        geojson.eachLayer(function(layer) {
            var dongName = layer.feature.properties['행정구역'];
            // 검색어가 포함된 동네 찾기 (가장 점수가 높은 곳 우선)
            if (dongName && dongName.indexOf(query) !== -1) {
                var score = layer.feature.properties['CAFLI_Index'] || 0;
                if (!foundLayer || score > foundScore) {
                    foundLayer = layer;
                    foundScore = score;
                }
            }
        });

        if (foundLayer) {
            map.flyToBounds(foundLayer.getBounds(), { maxZoom: 14, duration: 1.5 });
            // 검색된 레이어 하이라이트 및 정보창 띄우기
            setTimeout(function() {
                highlightFeature({ target: foundLayer });
            }, 1500);
        } else {
            alert("검색 결과가 없습니다.");
        }
    }

    // 정보창(우측 상단) 컨트롤
    var info = L.control();

    info.onAdd = function (map) {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };

    info.update = function (props) {
        this._div.innerHTML = '<h4>CAFLI (상권/인프라/차량/경사도) 지수</h4>' +  (props ?
            '<b>' + props['행정구역'] + '</b><br />' +
            '🏆 CAFLI 총점: <b>' + props['CAFLI_Index'] + ' 점</b><br /><br />' +
            '🚗 차량비의존도(V): ' + (props['V_score'] ? props['V_score'].toFixed(1) : 0) + '점<br />' +
            ' &nbsp;&nbsp;<span style="font-size:11px; color:#666;">(하이패스 밀도, 자가용 비율 등)</span><br />' +
            '🚌 대중교통활성(T): ' + (props['T_score'] ? props['T_score'].toFixed(1) : 0) + '점<br />' +
            ' &nbsp;&nbsp;<span style="font-size:11px; color:#666;">(정류장 밀도, 탑승 빈도)</span><br />' +
            '🏬 복합생활편의(S): ' + (props['S_score'] ? props['S_score'].toFixed(1) : 0) + '점<br />' +
            ' &nbsp;&nbsp;<span style="font-size:11px; color:#666;">(업종 다양성, 교차로 밀도)</span><br />' +
            '🚶‍♂️ 보행활성지수(W): ' + (props['W_score'] ? props['W_score'].toFixed(1) : 0) + '점<br />' +
            ' &nbsp;&nbsp;<span style="font-size:11px; color:#666;">(지형 평탄성, 단거리 집중도)</span>'
            : '행정동에 마우스를 올려보세요.');
    };
    info.addTo(map);

    // 3. CAFLI 점수에 따른 색상 결정 함수
    function getColor(d) {
        return d > 75 ? '#800026' :
               d > 70 ? '#BD0026' :
               d > 65 ? '#E31A1C' :
               d > 60 ? '#FC4E2A' :
               d > 55 ? '#FD8D3C' :
               d > 50 ? '#FEB24C' :
               d > 40 ? '#FED976' :
                        '#FFEDA0';
    }

    // 스타일 적용 함수 (읍면동 경계선을 보이지 않게 처리)
    function style(feature) {
        return {
            fillColor: getColor(feature.properties.CAFLI_Index),
            weight: 0, // 경계선 두께 0으로 설정하여 읍면동 구분선 제거
            opacity: 0, // 경계선 투명도
            color: 'transparent',
            fillOpacity: 0.8
        };
    }

    // 마우스 이벤트(호버) 처리
    var geojson;
    function highlightFeature(e) {
        var layer = e.target;
        // 호버 시에도 경계선이 두드러지지 않게 투명도만 살짝 조정
        layer.setStyle({
            fillOpacity: 1.0
        });
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
            layer.bringToFront();
        }
        info.update(layer.feature.properties);
    }

    function resetHighlight(e) {
        geojson.resetStyle(e.target);
        info.update();
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight
        });
    }

    // 4. GeoJSON 데이터 불러오기
    fetch('cafli_model_result.geojson')
        .then(response => {
            if (!response.ok) throw new Error("데이터를 불러오지 못했습니다.");
            return response.json();
        })
        .then(data => {
            geojson = L.geoJson(data, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);
            
            // [수정] 광역/기초자치단체 단위 라벨 생성 (서울특별시, 남양주시 등)
            var labelBounds = {};
            geojson.eachLayer(function(layer) {
                var nameParts = layer.feature.properties['행정구역'].split(' ');
                if (nameParts.length >= 2) {
                    var doName = nameParts[0];
                    var labelName = "";
                    
                    // 특별시, 광역시, 특별자치시 등은 해당 도시 전체를 하나로 묶음
                    if (doName.endsWith('시')) {
                        labelName = doName; 
                    } else {
                        // 경기도, 강원도 등은 시/군 단위로 묶음 (남양주시, 가평군 등)
                        labelName = nameParts[1];
                    }
                    
                    var bounds = layer.getBounds();
                    if (!labelBounds[labelName]) {
                        labelBounds[labelName] = { bounds: L.latLngBounds(bounds.getSouthWest(), bounds.getNorthEast()), name: labelName };
                    } else {
                        labelBounds[labelName].bounds.extend(bounds);
                    }
                }
            });

            // 계산된 영역의 중앙에 큰 라벨 텍스트 마커 추가
            for (var key in labelBounds) {
                var center = labelBounds[key].bounds.getCenter();
                L.marker(center, {
                    icon: L.divIcon({
                        className: 'gu-label',
                        html: '<div style="font-size: 18px; font-weight: 900; color: #111; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;">' + labelBounds[key].name + '</div>',
                        iconSize: [150, 30],
                        iconAnchor: [75, 15]
                    }),
                    interactive: false // 마우스 이벤트 무시 (지도 클릭 방해 방지)
                }).addTo(map);
            }

            // 데이터 범위에 맞게 지도 확대/축소 조절
            map.fitBounds(geojson.getBounds());
        })
        .catch(err => {
            console.error(err);
            alert('결과 데이터를 불러오는데 실패했습니다. ETL 파이프라인이 정상적으로 실행되었는지 확인해주세요.');
        });

    // 5. 범례(Legend) 추가
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend'),
            grades = [0, 40, 50, 55, 60, 65, 70, 75],
            labels = [];

        div.innerHTML += '<b>CAFLI 지수 (상위포함)</b><br>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
        }
        return div;
    };
    legend.addTo(map);

</script>
</body>
</html>
