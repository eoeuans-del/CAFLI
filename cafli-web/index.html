<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFLI 지수 시각화 결과</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .info {
            padding: 10px 15px;
            font: 14px/1.5 "Malgun Gothic", Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            color: #333;
        }
        .info h4 { margin: 0 0 5px; color: #555; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .legend {
            line-height: 22px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border: 1px solid #999;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // 1. 지도 초기화 (서울 중심)
    var map = L.map('map').setView([37.5665, 126.9780], 10);

    // 2. 배경 지도 추가 (OpenStreetMap)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // 정보창(우측 상단) 컨트롤
    var info = L.control();

    info.onAdd = function (map) {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };

    info.update = function (props) {
        this._div.innerHTML = '<h4>CAFLI (상권/인프라/차량/경사도) 지수</h4>' +  (props ?
            '<b>' + props['행정구역'] + '</b><br />' +
            '🏆 CAFLI 총점: <b>' + props['CAFLI_Index'] + ' 점</b><br /><br />' +
            '🚗 차량비의존도(V): ' + (props['V_score'] ? props['V_score'].toFixed(1) : 0) + '점<br />' +
            '🚌 대중교통밀도(T): ' + (props['T_score'] ? props['T_score'].toFixed(1) : 0) + '점<br />' +
            '🏬 상권편의성(S): ' + (props['S_score'] ? props['S_score'].toFixed(1) : 0) + '점<br />' +
            '⛰️ 평지친화도(W): ' + (props['W_score'] ? props['W_score'].toFixed(1) : 0) + '점'
            : '행정동에 마우스를 올려보세요.');
    };
    info.addTo(map);

    // 3. CAFLI 점수에 따른 색상 결정 함수
    function getColor(d) {
        return d > 75 ? '#800026' :
               d > 70 ? '#BD0026' :
               d > 65 ? '#E31A1C' :
               d > 60 ? '#FC4E2A' :
               d > 55 ? '#FD8D3C' :
               d > 50 ? '#FEB24C' :
               d > 40 ? '#FED976' :
                        '#FFEDA0';
    }

    // 스타일 적용 함수
    function style(feature) {
        return {
            fillColor: getColor(feature.properties.CAFLI_Index),
            weight: 1,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.7
        };
    }

    // 마우스 이벤트(호버) 처리
    var geojson;
    function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({
            weight: 3,
            color: '#666',
            dashArray: '',
            fillOpacity: 0.9
        });
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
            layer.bringToFront();
        }
        info.update(layer.feature.properties);
    }

    function resetHighlight(e) {
        geojson.resetStyle(e.target);
        info.update();
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight
        });
    }

    // 4. GeoJSON 데이터 불러오기
    fetch('cafli_model_result.geojson')
        .then(response => {
            if (!response.ok) throw new Error("데이터를 불러오지 못했습니다.");
            return response.json();
        })
        .then(data => {
            geojson = L.geoJson(data, {
                style: style,
                onEachFeature: onEachFeature
            }).addTo(map);
            
            // 데이터 범위에 맞게 지도 확대/축소 조절
            map.fitBounds(geojson.getBounds());
        })
        .catch(err => {
            console.error(err);
            alert('결과 데이터를 불러오는데 실패했습니다. ETL 파이프라인이 정상적으로 실행되었는지 확인해주세요.');
        });

    // 5. 범례(Legend) 추가
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info legend'),
            grades = [0, 40, 50, 55, 60, 65, 70, 75],
            labels = [];

        div.innerHTML += '<b>CAFLI 지수 (상위포함)</b><br>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML +=
                '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
        }
        return div;
    };
    legend.addTo(map);

</script>
</body>
</html>
